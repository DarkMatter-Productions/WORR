name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
      msi_version: ${{ steps.version.outputs.msi_version }}
      head_sha: ${{ steps.version.outputs.head_sha }}
      release_sequence: ${{ steps.sequence.outputs.value }}
      trust_policy_artifact_id: ${{ steps.upload_trust_policy.outputs.artifact-id }}
      trust_policy_artifact_digest: ${{ steps.upload_trust_policy.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare platform matrix
        id: matrix
        shell: bash
        run: |
          {
            echo "matrix<<EOF"
            python3 tools/release/targets.py --matrix-json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: version
        shell: bash
        env:
          WORR_RELEASE: 1
        run: |
          echo "version=$(python3 version.py --semver)" >> "$GITHUB_OUTPUT"
          echo "display_version=$(python3 version.py --version)" >> "$GITHUB_OUTPUT"
          echo "msi_version=$(python3 version.py --msi-version)" >> "$GITHUB_OUTPUT"
          echo "head_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compute monotonic release sequence
        id: sequence
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import os
          run_number = int(os.environ["RUN_NUMBER"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          if run_number <= 0 or not 1 <= run_attempt <= 50:
              raise SystemExit("invalid GitHub workflow sequence inputs")
          sequence = run_number * 100 + run_attempt
          if sequence > 9_223_372_036_854_775_807:
              raise SystemExit("release sequence exceeds signed 64-bit range")
          print(f"value={sequence}")
          PY

      - name: Materialize stable release trust policy once
        shell: bash
        env:
          WORR_STABLE_RELEASE_TRUST_POLICY_B64: ${{ secrets.WORR_STABLE_RELEASE_TRUST_POLICY_B64 }}
        run: |
          python3 tools/release/materialize_signing_secrets.py \
            --trust-policy-env WORR_STABLE_RELEASE_TRUST_POLICY_B64 \
            --repo "${{ github.repository }}" \
            --channel stable

      - name: Freeze stable release trust policy for this run
        shell: bash
        run: |
          mkdir -p release-policy
          cp --no-dereference -- "${WORR_RELEASE_TRUST_POLICY_PATH}" \
            release-policy/release-trust-policy.json

      - name: Upload immutable stable release trust policy
        id: upload_trust_policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worr-stable-trust-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-policy/release-trust-policy.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Remove materialized stable trust policy
        if: always()
        shell: bash
        run: python3 tools/release/cleanup_signing_secrets.py

  build:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      WORR_CHANNEL: stable
      WORR_RELEASE: 1
      WORR_BUILD_ID: ${{ github.run_id }}
      WORR_RELEASE_TRUST_POLICY_PATH: ${{ github.workspace }}/release-policy/release-trust-policy.json
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable stable release trust policy
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.trust_policy_artifact_id }}
          path: release-policy

      - name: Check shadowmapping guardrails
        shell: bash
        run: python3 tools/check_shadowmapping_guardrails.py

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config gcc g++ python3 python3-venv cmake nasm \
            libcurl4-openssl-dev libopenal-dev libpng-dev libjpeg-dev zlib1g-dev libvulkan-dev glslang-tools spirv-tools \
            libdbus-1-dev libpipewire-0.3-dev libudev-dev libxkbcommon-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxcursor-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols x11proto-dev libdecor-0-dev
          # ubuntu-latest currently maps to Ubuntu 24.04, where libsdl3-dev is unavailable.
          # Meson is already configured to use the bundled SDL3/SDL3_ttf wraps on Linux, but
          # the SDL3 subproject still needs its native Linux development dependencies.

      - name: Install hash-locked Meson toolchain
        if: matrix.os != 'windows'
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/meson-venv"
          "${RUNNER_TEMP}/meson-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/release/build-tool-requirements.txt
          echo "${RUNNER_TEMP}/meson-venv/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/meson-venv/bin/meson" --version

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        shell: bash
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja pkg-config cmake curl sdl3 openal-soft libpng jpeg-turbo \
            vulkan-loader molten-vk glslang spirv-tools

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-spirv-tools

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          meson setup builddir --wrap-mode=default --force-fallback-for=sdl3,sdl3_ttf --buildtype=release \
            -Dbase-game=basew \
            -Ddefault-game=basew \
            -Dbootstrapper=true -Dsdl3=enabled -Dtests=false -Davcodec=disabled -Dlibcurl=enabled \
            -Dharfbuzz:tests=disabled

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          meson setup builddir --wrap-mode=forcefallback --buildtype=release \
            -Dbase-game=basew \
            -Ddefault-game=basew \
            -Dbootstrapper=true -Dsdl3=enabled -Dtests=false -Davcodec=disabled -Dlibcurl=enabled \
            -Dharfbuzz:tests=disabled

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: meson compile -C builddir

      - name: Build (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: meson compile -C builddir

      - name: Refresh .install (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          python3 tools/refresh_install.py \
            --build-dir builddir \
            --install-dir .install \
            --base-game basew \
            --platform-id "${{ matrix.platform_id }}"

      - name: Refresh .install (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          python3 tools/refresh_install.py \
            --build-dir builddir \
            --install-dir .install \
            --base-game basew \
            --platform-id "${{ matrix.platform_id }}"

      - name: Install WiX Toolset
        if: matrix.has_installer
        shell: powershell
        run: choco install wixtoolset --version=3.14.1.20250415 -y --no-progress

      - name: Add WiX Toolset to PATH
        if: matrix.has_installer
        shell: powershell
        run: |
          $wixRoot = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*" | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixRoot) { throw "WiX Toolset install not found." }
          "$($wixRoot.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Windows installer layout
        if: matrix.has_installer
        shell: msys2 {0}
        run: |
          python3 tools/release/prepare_role_install.py \
            --input-dir .install \
            --output-dir .release-layout \
            --platform-id "${{ matrix.platform_id }}" \
            --role client \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --build-id "${WORR_BUILD_ID}" \
            --release-trust-policy "${WORR_RELEASE_TRUST_POLICY_PATH}"

      - name: Build MSI installer
        if: matrix.has_installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          .\tools\build_msi.ps1 -SourceDir .release-layout -OutputDir release -Version "${{ needs.prepare.outputs.msi_version }}" -MsiName worr-win64.msi

      - name: Package release assets (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p release
          python3 tools/release/package_platform.py \
            --input-dir .install \
            --output-dir release \
            --platform-id "${{ matrix.platform_id }}" \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --build-id "${WORR_BUILD_ID}" \
            --release-trust-policy "${WORR_RELEASE_TRUST_POLICY_PATH}"

      - name: Package release assets (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p release
          INSTALLER_ARG=""
          if [ -f "release/worr-win64.msi" ]; then
            INSTALLER_ARG="--installer-path release/worr-win64.msi"
          fi
          python3 tools/release/package_platform.py \
            --input-dir .install \
            --output-dir release \
            --platform-id "${{ matrix.platform_id }}" \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --build-id "${WORR_BUILD_ID}" \
            --release-trust-policy "${WORR_RELEASE_TRUST_POLICY_PATH}" \
            ${INSTALLER_ARG}

      - name: Upload platform release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform_id }}
          path: release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  release_candidate:
    needs: [prepare, build]
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WORR_RELEASE_TRUST_POLICY_PATH: ${{ github.workspace }}/release-policy/release-trust-policy.json
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags origin

      - name: Bind release tag to the prepared commit
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_HEAD="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "${TAG_HEAD}" != "${EXPECTED_HEAD}" ]]; then
              echo "Existing tag ${RELEASE_TAG} points to ${TAG_HEAD}, not ${EXPECTED_HEAD}" >&2
              exit 1
            fi
          fi

      - name: Download immutable stable release trust policy
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.trust_policy_artifact_id }}
          path: release-policy

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false

      - name: Install MSI validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools

      - name: Verify expected artifacts
        run: |
          python3 tools/release/verify_artifacts.py \
            --artifacts-root release-assets \
            --release-trust-policy "${WORR_RELEASE_TRUST_POLICY_PATH}"

      - name: Install hash-locked release-signing dependencies
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/release-signing-venv"
          "${RUNNER_TEMP}/release-signing-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/release/release-signing-requirements.txt
          echo "${RUNNER_TEMP}/release-signing-venv/bin" >> "$GITHUB_PATH"

      - name: Bind the frozen trust policy into the release candidate
        shell: bash
        run: |
          cp --no-dereference -- "${WORR_RELEASE_TRUST_POLICY_PATH}" \
            release-assets/release-trust-policy.json

      - name: Compose unsigned release candidate
        run: |
          python3 tools/release/compose_release_index.py \
            --artifacts-root release-assets \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --release-sequence "${{ needs.prepare.outputs.release_sequence }}" \
            --valid-for-days 180 \
            --revocation-file tools/release/revoked-release-indexes.json \
            --index-path release-assets/worr-release-index-stable.json \
            --asset-list-path release-assets/release-assets.txt \
            --trust-policy release-assets/release-trust-policy.json \
            --defer-signing \
            --signing-request-path release-assets/release-signing-request.json

      - name: Upload immutable stable release candidate control
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worr-stable-release-candidate-${{ github.run_id }}
          path: |
            release-assets/release-signing-request.json
            release-assets/release-trust-policy.json
            release-assets/worr-release-index-stable.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  authorize_release:
    needs: [prepare, build, release_candidate]
    if: needs.release_candidate.result == 'success'
    runs-on: ubuntu-24.04
    environment: stable-release-signing
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable stable release candidate control
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: worr-stable-release-candidate-${{ github.run_id }}
          path: release-assets

      - name: Download independent stable release trust policy
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.trust_policy_artifact_id }}
          path: release-policy

      - name: Download build artifacts for authorization
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false

      - name: Install MSI validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools

      - name: Verify expected artifacts before authorization
        run: |
          cmp --silent -- \
            release-policy/release-trust-policy.json \
            release-assets/release-trust-policy.json
          python3 tools/release/verify_artifacts.py \
            --artifacts-root release-assets \
            --release-trust-policy release-policy/release-trust-policy.json

      - name: Install hash-locked release-signing dependencies
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/release-signing-venv"
          "${RUNNER_TEMP}/release-signing-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/release/release-signing-requirements.txt
          echo "${RUNNER_TEMP}/release-signing-venv/bin" >> "$GITHUB_PATH"

      - name: Validate stable release candidate before signing
        shell: bash
        run: |
          python3 tools/release/release_signing.py verify-candidate \
            --signing-request release-assets/release-signing-request.json \
            --artifacts-root release-assets \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --release-sequence "${{ needs.prepare.outputs.release_sequence }}" \
            --valid-for-days 180 \
            --revocation-file tools/release/revoked-release-indexes.json

      - name: Materialize stable release signing secrets
        shell: bash
        env:
          WORR_STABLE_RELEASE_SIGNING_KEY_B64: ${{ secrets.WORR_STABLE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          python3 tools/release/materialize_signing_secrets.py \
            --trust-policy-file release-policy/release-trust-policy.json \
            --signing-key-env WORR_STABLE_RELEASE_SIGNING_KEY_B64 \
            --repo "${{ github.repository }}" \
            --channel stable

      - name: Sign stable release candidate
        shell: bash
        run: |
          python3 tools/release/release_signing.py sign-request \
            --signing-request release-assets/release-signing-request.json \
            --signature release-assets/release-authorization.partial.sig.json \
            --signing-key-list "${WORR_RELEASE_SIGNING_KEY_LIST_PATH}" \
            --artifacts-root release-assets \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --release-sequence "${{ needs.prepare.outputs.release_sequence }}" \
            --valid-for-days 180 \
            --revocation-file tools/release/revoked-release-indexes.json
          python3 tools/release/release_signing.py aggregate \
            --signing-request release-assets/release-signing-request.json \
            --signature release-assets/release-authorization.partial.sig.json

      - name: Remove release signing secrets before authorization upload
        if: always()
        shell: bash
        run: python3 tools/release/cleanup_signing_secrets.py

      - name: Upload immutable stable release authorization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worr-stable-release-authorization-${{ github.run_id }}
          path: |
            release-assets/release-assets.txt
            release-assets/release-signing-request.json
            release-assets/release-signing-request.json.authorization.sig.json
            release-assets/release-trust-policy.json
            release-assets/worr-release-index-stable.json
            release-assets/worr-release-index-stable.json.sig.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish_release:
    needs: [prepare, build, release_candidate, authorize_release]
    if: needs.authorize_release.result == 'success'
    runs-on: ubuntu-24.04
    environment: stable-release-publishing
    permissions:
      contents: write
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable stable release authorization
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: worr-stable-release-authorization-${{ github.run_id }}
          path: release-assets

      - name: Download independent stable release trust policy
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.trust_policy_artifact_id }}
          path: release-policy

      - name: Download build artifacts for publication
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false

      - name: Install hash-locked release-signing dependencies
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/release-signing-venv"
          "${RUNNER_TEMP}/release-signing-venv/bin/pip" install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/release/release-signing-requirements.txt
          echo "${RUNNER_TEMP}/release-signing-venv/bin" >> "$GITHUB_PATH"

      - name: Cryptographically verify stable release authorization
        shell: bash
        run: |
          cmp --silent -- \
            release-policy/release-trust-policy.json \
            release-assets/release-trust-policy.json
          python3 tools/release/release_signing.py verify-publish \
            --signing-request release-assets/release-signing-request.json \
            --signature release-assets/worr-release-index-stable.json.sig.json \
            --authorization release-assets/release-signing-request.json.authorization.sig.json \
            --asset-list release-assets/release-assets.txt \
            --trust-policy release-policy/release-trust-policy.json \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --release-sequence "${{ needs.prepare.outputs.release_sequence }}"

      - name: Generate release notes
        run: |
          python3 tools/release/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --channel stable \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.head_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --index-path release-assets/worr-release-index-stable.json \
            --trust-policy-path release-policy/release-trust-policy.json \
            --output release-assets/release-notes.md

      - name: Publish exact release through a draft gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/publish_github_release.py \
            --repo "${{ github.repository }}" \
            --tag "v${{ needs.prepare.outputs.version }}" \
